{% extends "accounts/auth_base.html" %}
{% block title %}ลืมรหัสผ่าน - Arai Go GU{% endblock %}
{% block content %}
<h1 class="font-kanit fw-bold text-center mb-4" style="font-size: 1.75rem;">ลืมรหัสผ่าน</h1>
<p class="text-center text-muted mb-4">กรอกอีเมลที่ใช้สมัคร เราจะส่งลิงก์ตั้งรหัสผ่านใหม่ให้</p>
<form method="post">{% csrf_token %}
    <div class="form-group">
        <label class="form-label" for="id_email">อีเมล</label>
        <div class="input-with-icon">
            <i class="bi bi-envelope input-icon"></i>
            <input type="email" name="email" id="id_email" class="form-control" placeholder="กรอกอีเมลของคุณ" required autofocus>
        </div>
        {% for e in form.email.errors %}<div class="text-danger small mt-1">{{ e }}</div>{% endfor %}
    </div>
    <button type="submit" class="btn-login">ส่งลิงก์</button>
</form>
<div class="login-links">
    <a href="{% url 'accounts:login' %}" class="login-link"><i class="bi bi-arrow-left"></i> กลับไปเข้าสู่ระบบ</a>
</div>
{% endblock %}
