{% extends "accounts/auth_base.html" %}
{% block title %}ลืมรหัสผ่าน | ARAI GO GU{% endblock %}
{% block content %}
<div class="auth-icon"><i class="bi bi-key"></i></div>
<h1>ลืมรหัสผ่าน</h1>
<p class="auth-sub">กรอกอีเมลที่ใช้สมัคร เราจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ให้</p>
<form method="post">{% csrf_token %}
    <div class="field">
        <label class="field-label" for="id_email">อีเมล</label>
        <div class="input-wrap">
            <i class="bi bi-envelope"></i>
            <input type="email" name="email" id="id_email" placeholder="you@example.com" autocomplete="email" required autofocus>
        </div>
        {% for e in form.email.errors %}<div class="field-error"><i class="bi bi-exclamation-circle"></i>{{ e }}</div>{% endfor %}
    </div>
    <button type="submit" class="btn-solid btn-lg-pill w-100">ส่งลิงก์</button>
</form>
<p class="auth-foot"><a href="{% url 'accounts:login' %}" class="fw-normal muted"><i class="bi bi-arrow-left"></i> กลับไปเข้าสู่ระบบ</a></p>
{% endblock %}
